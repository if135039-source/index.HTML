<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Matematika Paling Seru</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body {
        background: linear-gradient(135deg, #ffd1dc, #ffe6f2);
        font-family: Poppins, sans-serif;
        text-align: center;
        padding: 20px;
        animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }

    h1 {
        font-size: 45px;
        color: #ff4f8b;
        text-shadow: 2px 2px white;
    }

    #gameBox {
        background: white;
        padding: 20px;
        border-radius: 20px;
        width: 90%;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 0 20px rgba(255, 0, 100, 0.2);
        animation: bounce 1s ease;
    }

    @keyframes bounce {
        0% {transform: scale(0.7);}
        60% {transform: scale(1.1);}
        100% {transform: scale(1);}
    }

    #question {
        font-size: 40px;
        margin: 20px;
        color: #ff2e79;
        font-weight: bold;
    }

    .btn-number {
        width: 90px;
        height: 90px;
        font-size: 35px;
        margin: 10px;
        border: none;
        border-radius: 20px;
        background: #ff8fb1;
        color: white;
        box-shadow: 0 4px 8px rgba(255, 0, 150, 0.3);
        transition: 0.2s;
    }

    .btn-number:active {
        transform: scale(0.9);
        background: #ff5c95;
    }

    #timer {
        font-size: 40px;
        color: #d6005f;
        margin: 15px 0;
    }

    #log {
        font-size: 20px;
        margin-top: 20px;
        text-align: left;
        background: #ffe0ed;
        padding: 15px;
        border-radius: 15px;
        height: 200px;
        overflow-y: auto;
    }

    #chartBox {
        width: 100%;
        max-width: 400px;
        margin: auto;
        margin-top: 25px;
    }

</style>
</head>
<body>

<h1>🎉 Game Matematika Paling Seru 🎉</h1>
<div id="timer">Waktu: 30</div>

<div id="gameBox">
    <div id="question">Tekan Mulai!</div>
    <button onclick="startGame()" style="font-size:25px;padding:15px;border:none;border-radius:20px;background:#ff619c;color:white;">
        Mulai Game
    </button>

    <div id="answerButtons" style="margin-top:20px; display:none;">
        <button class="btn-number" onclick="pickNumber(0)">0</button>
        <button class="btn-number" onclick="pickNumber(1)">1</button>
        <button class="btn-number" onclick="pickNumber(2)">2</button><br>
        <button class="btn-number" onclick="pickNumber(3)">3</button>
        <button class="btn-number" onclick="pickNumber(4)">4</button>
        <button class="btn-number" onclick="pickNumber(5)">5</button><br>
        <button class="btn-number" onclick="pickNumber(6)">6</button>
        <button class="btn-number" onclick="pickNumber(7)">7</button>
        <button class="btn-number" onclick="pickNumber(8)">8</button><br>
        <button class="btn-number" onclick="pickNumber(9)">9</button>
    </div>
</div>

<div id="chartBox">
    <canvas id="resultChart"></canvas>
</div>

<h2>📘 Riwayat Jawaban</h2>
<div id="log"></div>

<script>

let correct = 0;
let wrong = 0;
let answer = 0;
let timeLeft = 30;
let timer;
let chart;

function startGame() {
    correct = 0;
    wrong = 0;
    timeLeft = 30;

    document.getElementById("answerButtons").style.display = "block";
    document.getElementById("log").innerHTML = "";
    createChart();

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerHTML = "Waktu: " + timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            endGame();
        }
    }, 1000);

    newQuestion();
}

function newQuestion() {
    let a = Math.floor(Math.random() * 20);
    let b = Math.floor(Math.random() * 20);
    
    answer = a + b;

    document.getElementById("question").innerHTML = `${a} + ${b} = ?`;
}

function pickNumber(num) {
    if (num == answer) {
        correct++;
        addLog(`✔ Jawaban benar: ${answer}`);
        animationCorrect();
    } else {
        wrong++;
        addLog(`❌ Jawaban salah: ${num} (Seharusnya ${answer})`);
        animationWrong();
    }
    updateChart();
    newQuestion();
}

function addLog(text) {
    document.getElementById("log").innerHTML += text + "<br>";
}

function endGame() {
    document.getElementById("question").innerHTML = "⏳ Waktu Habis!";
    document.getElementById("answerButtons").style.display = "none";
}

function animationCorrect() {
    document.body.style.background = "#ccffdd";
    setTimeout(() => {
        document.body.style.background = "linear-gradient(135deg, #ffd1dc, #ffe6f2)";
    }, 150);
}

function animationWrong() {
    document.body.style.background = "#ffcccc";
    setTimeout(() => {
        document.body.style.background = "linear-gradient(135deg, #ffd1dc, #ffe6f2)";
    }, 150);
}

function createChart() {
    const ctx = document.getElementById("resultChart");
    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ["Benar", "Salah"],
            datasets: [{
                label: "Jumlah",
                data: [0, 0],
                borderWidth: 2
            }]
        }
    });
}

function updateChart() {
    chart.data.datasets[0].data = [correct, wrong];
    chart.update();
}

</script>
</body>
</html>
