<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Bahasa Inggris - Nama Buah</title>

<style>
    body {
        background: #eaffea;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
    }
    #game-box {
        background: white;
        padding: 20px;
        margin: auto;
        max-width: 500px;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    h1 {
        color: #2b8a3e;
    }
    img {
        width: 240px;
        height: auto;
        border-radius: 15px;
        margin-bottom: 15px;
    }
    input {
        width: 80%;
        padding: 10px;
        border: 2px solid #2b8a3e;
        border-radius: 8px;
        font-size: 18px;
    }
    button {
        margin-top: 12px;
        padding: 10px 25px;
        font-size: 18px;
        background: #2b8a3e;
        border: none;
        color: white;
        border-radius: 10px;
        cursor: pointer;
    }
    button:hover {
        background: #237031;
    }
    #result {
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>🍎 English Fruit Game 🍌</h1>

<div id="game-box">
    <h2>Tebak Nama Buah Ini!</h2>

    <img id="fruit-image" src="" alt="Fruit">

    <input type="text" id="answer" placeholder="Type the fruit name in English..."><br>

    <button onclick="checkAnswer()">Check Answer</button>

    <p id="result"></p>

    <button onclick="nextFruit()">Next Fruit ➡️</button>
</div>

<script>
// Daftar buah + gambar
const fruits = [
    {name: "apple", img: "https://i.ibb.co/3FTdZF4/apple.jpg"},
    {name: "banana", img: "https://i.ibb.co/NVqr9T7/banana.jpg"},
    {name: "orange", img: "https://i.ibb.co/9Gx73Q8/orange.jpg"},
    {name: "grape", img: "https://i.ibb.co/dJR4Y4M/grape.jpg"},
    {name: "mango", img: "https://i.ibb.co/7YyvzZ6/mango.jpg"},
    {name: "watermelon", img: "https://i.ibb.co/J5YQDdp/watermelon.jpg"},
    {name: "pineapple", img: "https://i.ibb.co/3m4p6x0/pineapple.jpg"},
    {name: "strawberry", img: "https://i.ibb.co/0j3Wqkc/strawberry.jpg"}
];

let currentFruit = null;

// Fungsi buah baru
function nextFruit() {
    const randomIndex = Math.floor(Math.random() * fruits.length);
    currentFruit = fruits[randomIndex];

    document.getElementById("fruit-image").src = currentFruit.img;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerHTML = "";
}

// Cek jawaban
function checkAnswer() {
    const userAnswer = document.getElementById("answer").value.toLowerCase();

    if (userAnswer === currentFruit.name) {
        document.getElementById("result").innerHTML = "✔️ Correct! Great job!";
        document.getElementById("result").style.color = "green";
    } else {
        document.getElementById("result").innerHTML =
            "❌ Wrong! The correct answer is: <b>" + currentFruit.name + "</b>";
        document.getElementById("result").style.color = "red";
    }
}

// Mulai game dari buah pertama
nextFruit();
</script>

</body>
</html>
