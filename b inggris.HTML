<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Anak - Bahasa Inggris Nama Buah</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f7ffe5;
        margin: 0;
        padding: 20px;
    }
    h1 {
        color: #4CAF50;
    }
    #game-box {
        background: white;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    img {
        width: 200px;
        margin-bottom: 20px;
        border-radius: 10px;
    }
    button {
        background: #4CAF50;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        color: white;
        cursor: pointer;
        margin-top: 10px;
    }
    button:hover {
        background: #45a049;
    }
    input {
        padding: 10px;
        width: 80%;
        border-radius: 10px;
        border: 2px solid #4CAF50;
        font-size: 16px;
    }
    #result {
        font-size: 20px;
        margin-top: 10px;
        font-weight: bold;
    }
</style>
</head>
