<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Sprint – Fokus Timer Otomatis</title>

<style>
    :root {
        --bg: #f6f5f2;
        --card: #ffffff;
        --text: #333;
        --primary: #6c63ff;
        --accent: #ff6584;
        --rest: #36c57f;
    }

    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    h1 {
        margin-top: 10px;
        font-weight: 600;
        font-size: 28px;
        text-align: center;
    }

    .timer-card {
        margin-top: 20px;
        background: var(--card);
        padding: 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
    }

    .time-display {
        font-size: 60px;
        font-weight: 700;
        margin: 20px 0;
        color: var(--primary);
        transition: 0.3s;
    }

    .rest-mode {
        color: var(--rest) !important;
    }

    .preset-buttons button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    .controls button {
        margin: 10px 5px;
        padding: 12px 20px;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        cursor: pointer;
        background: var(--accent);
        color: white;
        font-weight: 600;
    }

    #pause { background: #ffa135; }
    #reset { background: #555; }

    .stat {
        margin-top: 20px;
        font-size: 16px;
        opacity: 0.7;
    }

    input {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ccc;
        width: 80px;
        margin-top: 10px;
        text-align: center;
    }

    .mode-label {
        margin-top: 10px;
        padding: 6px 12px;
        border-radius: 10px;
        font-size: 14px;
        background: #eee;
        display: inline-block;
        font-weight: 600;
    }
</style>
</head>

<body>

<h1>Study Sprint</h1>

<div class="timer-card">
    <div id="modeLabel" class="mode-label">Mode: Belajar</div>

    <div id="time" class="time-display">25:00</div>

    <div class="preset-buttons">
        <button onclick="setStudy(15)">15m</button>
        <button onclick="setStudy(25)">25m</button>
        <button onclick="setStudy(45)">45m</button>
    </div>

    <p>Custom (menit):</p>
    <input type="number" id="customInput" min="1" max="180">
    <button onclick="setCustom()">Set</button>

    <div class="controls">
        <button id="start" onclick="startTimer()">Start</button>
        <button id="pause" onclick="pauseTimer()">Pause</button>
        <button id="reset" onclick="resetTimer()">Reset</button>
    </div>

    <div class="stat">
        Sprint belajar selesai: <span id="sprintCount">0</span>
    </div>
</div>

<audio id="alarm">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3">
</audio>

<script>
    // Durasi default
    let studyDuration = 25 * 60;
    let restDuration = 5 * 60;

    let timeLeft = studyDuration;
    let timerId = null;
    let sprintDone = 0;
    let isRest = false;

    const display = document.getElementById("time");
    const modeLabel = document.getElementById("modeLabel");

    function updateDisplay() {
        const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
        const s = String(timeLeft % 60).padStart(2, "0");
        display.textContent = `${m}:${s}`;
    }

    function setStudy(min) {
        pauseTimer();
        isRest = false;
        studyDuration = min * 60;
        timeLeft = studyDuration;
        modeLabel.textContent = "Mode: Belajar";
        display.classList.remove("rest-mode");
        updateDisplay();
    }

    function setCustom() {
        let custom = document.getElementById("customInput").value;
        if (!custom || custom < 1) return;
        setStudy(custom);
    }

    function startTimer() {
        if (timerId) return;

        timerId = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerId = null;
                document.getElementById("alarm").play();

                if (!isRest) {
                    sprintDone++;
                    document.getElementById("sprintCount").textContent = sprintDone;

                    // Masuk ke mode istirahat otomatis
                    startRest();
                } else {
                    // Setelah istirahat → belajar lagi otomatis
                    startStudyMode();
                }
                return;
            }

            timeLeft--;
            updateDisplay();
        }, 1000);
    }

    function startRest() {
        isRest = true;
        timeLeft = restDuration;
        modeLabel.textContent = "Mode: Istirahat 🌿";
        display.classList.add("rest-mode");
        updateDisplay();
        startTimer();
    }

    function startStudyMode() {
        isRest = false;
        timeLeft = studyDuration;
        modeLabel.textContent = "Mode: Belajar 📘";
        display.classList.remove("rest-mode");
        updateDisplay();
        startTimer();
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
    }

    function resetTimer() {
        pauseTimer();
        isRest = false;
        timeLeft = studyDuration;
        modeLabel.textContent = "Mode: Belajar";
        display.classList.remove("rest-mode");
        updateDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
