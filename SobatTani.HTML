<div class="game">

    <h1>🌱 EcoMaggot</h1>

    <h2 id="level">
        Level 1
    </h2>

    <h3 id="levelName">
        Petani Pemula 🌱
    </h3>

    <p>
        🪙 Eco-Points:
        <strong id="points">0</strong>
    </p>

    <p>
        ♻️ Limbah terkumpul:
        <strong id="totalWaste">0 kg</strong>
    </p>

    <div class="progress">
        <div id="levelProgress"></div>
    </div>


    <h2>🎯 Misi Hari Ini</h2>

    <div id="mission-waste">
        ♻️ Setor limbah
        <br>

        <input
            type="number"
            id="wasteInput"
            placeholder="Jumlah kg"
        >

        <button onclick="submitWaste()">
            Setor Limbah
        </button>
    </div>

    <br>

    <div id="mission-maggot">
        🐛 Rawat Maggot

        <button onclick="careMaggot()">
            Selesaikan
        </button>
    </div>

    <br>

    <div id="mission-plant">
        🌱 Rawat Tanaman

        <button onclick="carePlant()">
            Selesaikan
        </button>
    </div>


    <h2>🎁 Reward</h2>

    <button onclick="redeemReward(1)">
        🏅 Badge — 100 Poin
    </button>

    <button onclick="redeemReward(2)">
        🌱 Bibit — 250 Poin
    </button>

    <button onclick="redeemReward(3)">
        🐛 Maggot — 500 Poin
    </button>

    <button onclick="redeemReward(4)">
        💧 Pupuk — 750 Poin
    </button>

    <button onclick="redeemReward(5)">
        🏆 Eco Hero — 1000 Poin
    </button>

</div>


<div id="notification"></div>


<div id="levelUpPopup">

    <h1>🎉 LEVEL UP!</h1>

    <p id="newLevel"></p>

</div>

<script src="script.js"></script>
