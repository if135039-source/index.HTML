<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personality Quiz</title>

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #b8e8ff, #e3d7ff);
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 90%;
        max-width: 500px;
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        text-align: center;
        animation: fadeIn 0.7s;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    button {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: none;
        background: #8ba3ff;
        color: white;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #6f87f5;
    }

    .hidden {
        display: none;
    }
</style>
</head>

<body>

<div class="container" id="quizContainer">

    <h2 id="question">Loading...</h2>

    <div id="answers"></div>

</div>

<script>
const questions = [
    {
        q: "Kamu lebih suka menghabiskan waktu di…",
        options: [
            { text: "Tempat ramai penuh aktivitas", type: "Enerjik" },
            { text: "Tempat tenang dan nyaman", type: "Tenang" },
            { text: "Tempat estetik untuk bikin konten", type: "Kreatif" }
        ]
    },
    {
        q: "Kalau punya waktu libur, kamu akan…",
        options: [
            { text: "Keluar jalan-jalan", type: "Enerjik" },
            { text: "Tidur dan recharge energi", type: "Tenang" },
            { text: "Membuat sesuatu (gambar, video, tulisan)", type: "Kreatif" }
        ]
    },
    {
        q: "Kamu paling suka tipe musik yang…",
        options: [
            { text: "Beat cepat & bikin semangat", type: "Enerjik" },
            { text: "Lofi, mellow, calm", type: "Tenang" },
            { text: "Indie, unik, penuh karakter", type: "Kreatif" }
        ]
    }
];

let index = 0;
let score = { "Enerjik": 0, "Tenang": 0, "Kreatif": 0 };

function loadQuestion() {
    const q = questions[index];
    document.getElementById("question").innerText = q.q;

    const answerDiv = document.getElementById("answers");
    answerDiv.innerHTML = "";

    q.options.forEach((opt) => {
        let btn = document.createElement("button");
        btn.innerText = opt.text;
        btn.onclick = () => selectAnswer(opt.type);
        answerDiv.appendChild(btn);
    });
}

function selectAnswer(type) {
    score[type]++;

    index++;
    if (index < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    const container = document.getElementById("quizContainer");

    // cari tipe terbanyak
    let finalType = Object.keys(score).reduce((a, b) => 
        score[a] > score[b] ? a : b
    );
    
    const descriptions = {
        "Enerjik": "Kamu penuh semangat, aktif, dan suka berpetualang! ✨🔥",
        "Tenang": "Kamu lembut, kalem, dan suka suasana damai. ☁️💙",
        "Kreatif": "Kamu imajinatif, unik, dan suka menciptakan hal baru. 🎨🌈"
    };

    container.innerHTML = `
        <h2>Hasil Kepribadian Kamu</h2>
        <h1 style="color:#6f87f5;">${finalType}</h1>
        <p>${descriptions[finalType]}</p>
        <button onclick="location.reload()">Ulangi Quiz</button>
    `;
}

loadQuestion();
</script>

</body>
</html>
