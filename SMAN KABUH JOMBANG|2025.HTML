<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kuis IPA Estetik</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body{
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #a8edea, #fed6e3);
        margin:0;
        padding:0;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        overflow-x:hidden;
    }

    .container{
        width:90%;
        max-width:600px;
        background:rgba(255,255,255,0.25);
        backdrop-filter:blur(10px);
        padding:25px;
        border-radius:20px;
        box-shadow:0 8px 20px rgba(0,0,0,0.1);
        animation: fadein 0.8s ease;
    }

    @keyframes fadein {
        from {opacity:0; transform:translateY(20px);}
        to {opacity:1; transform:translateY(0);}
    }

    h1{
        text-align:center;
        color:#333;
        margin-bottom:20px;
        font-size:28px;
    }

    button{
        width:100%;
        padding:13px;
        margin:8px 0;
        border:none;
        border-radius:12px;
        background:#fff;
        font-size:16px;
        cursor:pointer;
        transition:0.2s;
        box-shadow:0 5px 10px rgba(0,0,0,0.1);
    }

    button:hover{
        transform:scale(1.03);
    }

    .correct{
        background:#a7f3d0 !important;
        animation: correctAnim 0.4s ease;
    }

    @keyframes correctAnim {
        0%{transform:scale(1);}
        50%{transform:scale(1.1);}
        100%{transform:scale(1);}
    }

    .wrong{
        background:#fecaca !important;
        animation: wrongAnim 0.4s ease;
    }

    @keyframes wrongAnim {
        0%{transform:translateX(0);}
        25%{transform:translateX(-5px);}
        50%{transform:translateX(5px);}
        100%{transform:translateX(0);}
    }

    #startBtn{
        background:#ffd2e8;
        font-weight:600;
        letter-spacing:1px;
    }

    .hidden{display:none;}

    #scoreBox{
        text-align:center;
        font-size:20px;
        font-weight:600;
        margin-top:20px;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Kuis IPA Estetik</h1>

    <button id="startBtn">Mulai Kuis</button>

    <div id="quizArea" class="hidden">
        <h2 id="question"></h2>
        <div id="answers"></div>
        <p id="progress"></p>
    </div>

    <div id="scoreBox" class="hidden"></div>
</div>

<script>
// ------------------------------
// Efek Suara Lucu
// ------------------------------
function playBeep(freq){
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    osc.type="sine";
    osc.frequency.value=freq;
    osc.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function soundClick(){ playBeep(650); }
function soundCorrect(){ playBeep(900); }
function soundWrong(){ playBeep(250); }


// ------------------------------
// 20 Soal IPA
// ------------------------------
const questions = [
    {q:"Zat yang bentuk dan volumenya tetap adalah…", a:["Padat","Cair","Gas","Plasma"], correct:0},
    {q:"Perubahan wujud dari cair ke gas disebut…", a:["Mencair","Menguap","Membeku","Menyublim"], correct:1},
    {q:"Indra manusia untuk membedakan rasa adalah…", a:["Hidung","Kulit","Lidah","Telinga"], correct:2},
    {q:"Energi yang dihasilkan dari makanan adalah…", a:["Kimia","Listrik","Cahaya","Gerak"], correct:0},
    {q:"Bagian tumbuhan tempat terjadinya fotosintesis adalah…", a:["Akar","Batang","Bunga","Daun"], correct:3},
    {q:"Gaya yang arah geraknya menjauh dari pusat lingkaran yaitu…", a:["Gaya Gesek","Gaya Sentripetal","Gaya Gravitasi","Gaya Sentifugal"], correct:3},
    {q:"Planet terdekat dengan matahari adalah…", a:["Bumi","Venus","Mars","Merkurius"], correct:3},
    {q:"Bagian sel yang berfungsi mengatur kegiatan sel adalah…", a:["Inti sel","Sitoplasma","Membran sel","Klorofil"], correct:0},
    {q:"Sumber energi utama bagi bumi adalah…", a:["Matahari","Awan","Bulan","Air"], correct:0},
    {q:"Hewan mamalia berkembang biak dengan cara…", a:["Bertelur","Melahirkan","Membelah diri","Berkecambah"], correct:1},
    {q:"Alat untuk mengukur suhu adalah…", a:["Barometer","Higrometer","Termometer","Anemometer"], correct:2},
    {q:"Gas yang paling banyak di atmosfer adalah…", a:["Oksigen","Nitrogen","Karbon Dioksida","Hidrogen"], correct:1},
    {q:"Proses perubahan warna pisang menjadi coklat disebut…", a:["Fermentasi","Respirasi","Oksidasi","Destilasi"], correct:2},
    {q:"Lapisan bumi paling luar disebut…", a:["Inti","Mantel","Kerak","Astenosfer"], correct:2},
    {q:"Alat kelamin jantan pada bunga adalah…", a:["Putik","Benang sari","Kelopak","Mahkota"], correct:1},
    {q:"Air hujan yang tertampung dalam tanah disebut…", a:["Air tanah","Air permukaan","Air laut","Embun"], correct:0},
    {q:"Benda hitam menyerap cahaya…", a:["Seluruhnya","Sebagian","Tidak ada","Terpantul semua"], correct:0},
    {q:"Perpindahan panas tanpa zat perantara disebut…", a:["Konduksi","Konveksi","Radiasi","Isolasi"], correct:2},
    {q:"Hewan pemakan tumbuhan disebut…", a:["Karnivora","Omnivora","Herbivora","Detritivor"], correct:2},
    {q:"Perubahan wujud dari gas ke cair disebut…", a:["Membeku","Mengembun","Menguap","Menyublim"], correct:1}
];

let index = 0;
let score = 0;

const startBtn = document.getElementById("startBtn");
const quizArea = document.getElementById("quizArea");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const progressEl = document.getElementById("progress");
const scoreBox = document.getElementById("scoreBox");

startBtn.onclick = () => {
    soundClick();
    startBtn.classList.add("hidden");
    quizArea.classList.remove("hidden");
    loadQuestion();
};

function loadQuestion(){
    let q = questions[index];
    questionEl.textContent = q.q;
    answersEl.innerHTML = "";

    q.a.forEach((ans,i)=>{
        let btn = document.createElement("button");
        btn.textContent = ans;

        btn.onclick = () => {
            soundClick();

            if(i === q.correct){
                btn.classList.add("correct");
                soundCorrect();
                score++;
            }else{
                btn.classList.add("wrong");
                soundWrong();
            }

            setTimeout(()=>{
                index++;
                if(index < questions.length){
                    loadQuestion();
                }else{
                    showScore();
                }
            },600);
        };

        answersEl.appendChild(btn);
    });

    progressEl.textContent = `Soal ${index+1} dari ${questions.length}`;
}

function showScore(){
    quizArea.classList.add("hidden");
    scoreBox.classList.remove("hidden");

    scoreBox.innerHTML = `
        🎉 <br> Nilai Kamu: <b>${score}</b> dari ${questions.length}
        <br><br>
        <button onclick="location.reload()">Main Lagi</button>
    `;
}
</script>

</body>
</html>
