<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kuis IPA Estetik</title>
<style>
  body{
    margin:0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#d4e4ff,#fce1ff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .card{
    width:90%;
    max-width:600px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.1);
    animation:fadeIn .7s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  h1{text-align:center;margin-bottom:20px;color:#3b3b3b;}
  button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    background:#ffffff;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
  }
  button:hover{transform:scale(1.03);}
  .benar{background:#b7ffce !important;}
  .salah{background:#ffb7b7 !important;}
  #grafik{width:100%;height:250px;margin-top:20px;}
</style>
</head>
<body>
<div class="card" id="app">
  <h1>Kuis IPA Estetik</h1>
  <button id="mulai">Mulai Kuis</button>
  <div id="kuis" style="display:none;"></div>
  <canvas id="grafik"></canvas>
</div>

<script>
const soal = [
  {t:'Apa satuan SI untuk gaya?', o:['Newton','Joule','Watt','Pascal'], j:0, p:'Gaya diukur dalam Newton (N).'},
  {t:'Planet terdekat dari Matahari?', o:['Venus','Merkurius','Mars','Bumi'], j:1, p:'Merkurius adalah planet terdekat dari Matahari.'},
  {t:'Fungsi akar pada tumbuhan adalah?', o:['Menyerap air','Fotosintesis','Reproduksi','Membuat buah'], j:0, p:'Akar menyerap air dan mineral dari tanah.'},
  {t:'Air mendidih pada suhu?', o:['50°C','100°C','150°C','200°C'], j:1, p:'Air murni mendidih pada suhu 100°C di tekanan normal.'},
  {t:'Bagian mata untuk melihat warna?', o:['Pupil','Lensa','Retina','Konus'], j:3, p:'Sel konus pada retina mendeteksi warna.'},
  {t:'Benda langit yang memancarkan cahaya sendiri?', o:['Planet','Bintang','Asteroid','Komet'], j:1, p:'Bintang memancarkan cahaya sendiri.'},
  {t:'Jenis energi pada makanan?', o:['Kinetik','Kimia','Listrik','Cahaya'], j:1, p:'Makanan menyimpan energi kimia.'},
  {t:'Bagian tumbuhan tempat fotosintesis?', o:['Akar','Batang','Daun','Bunga'], j:2, p:'Daun memiliki klorofil untuk fotosintesis.'},
  {t:'Alat ukur suhu?', o:['Termometer','Barometer','Higrometer','Altimeter'], j:0, p:'Termometer mengukur suhu.'},
  {t:'Gaya yang menahan kita di bumi?', o:['Magnet','Listrik','Gravitasi','Gesek'], j:2, p:'Gravitasi menarik benda ke pusat bumi.'},
  {t:'Sumber energi terbesar di bumi?', o:['Air','Matahari','Angin','Panas bumi'], j:1, p:'Matahari adalah sumber energi utama bumi.'},
  {t:'Matahari termasuk?', o:['Planet','Bintang','Asteroid','Satelit'], j:1, p:'Matahari adalah bintang.'},
  {t:'Bagian tumbuhan yang menghasilkan buah?', o:['Akar','Daun','Batang','Bunga'], j:3, p:'Buah berkembang dari bunga.'},
  {t:'Satuan kuat arus listrik?', o:['Volt','Ohm','Ampere','Joule'], j:2, p:'Kuat arus listrik diukur dalam Ampere (A).'},
  {t:'Jenis perubahan wujud es menjadi air?', o:['Menguap','Mencair','Membeku','Menyublim'], j:1, p:'Es mencair menjadi air.'},
  {t:'Alat untuk melihat benda kecil?', o:['Mikroskop','Teleskop','Periskop','Kamera'], j:0, p:'Mikroskop memperbesar objek kecil.'},
  {t:'Organ pernapasan manusia?', o:['Jantung','Paru-paru','Lambung','Ginjal'], j:1, p:'Paru-paru berfungsi sebagai organ pernapasan.'},
  {t:'Gas yang dibutuhkan tumbuhan?', o:['Oksigen','Nitrogen','Karbon dioksida','Helium'], j:2, p:'Tumbuhan membutuhkan CO₂ untuk fotosintesis.'},
  {t:'Bunyi merambat melalui?', o:['Vakum','Udara','Cahaya','Es'], j:1, p:'Bunyi memerlukan medium seperti udara.'},
  {t:'Gaya gesek bekerja berlawanan dengan?', o:['Arah gerak','Arah gaya','Arah angin','Arah cahaya'], j:0, p:'Gaya gesek berlawanan dengan arah gerak.'}
];

const klikSuara = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');
const benarSuara = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
const salahSuara = new Audio('https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3');

let index=0, benar=0, salah=0;

mulai.onclick=()=>{
  klikSuara.play();
  mulai.style.display='none';
  tampilSoal();
};

function tampilSoal(){
  const q=soal[index];
  kuis.style.display='block';
  kuis.innerHTML=`<h3>${index+1}. ${q.t}</h3>`+
    q.o.map((o,i)=>`<button onclick="jawab(${i})">${o}</button>`).join('');
}

function jawab(i){
  klikSuara.play();
  const q=soal[index];
  const btn=document.querySelectorAll('#kuis button');

  btn.forEach(b=>b.disabled=true);

  if(i===q.j){
    benar++;
    benarSuara.play();
    btn[i].classList.add('benar');
  } else {
    salah++;
    salahSuara.play();
    btn[i].classList.add('salah');
    btn[q.j].classList.add('benar');
  }

  setTimeout(()=>{
    if(index<soal.length-1){
      index++;
      tampilSoal();
    } else selesai();
  },800);
}

function selesai(){
  kuis.innerHTML='<h2>Hasil Kuis</h2>'+
    `<p>Benar: ${benar}</p><p>Salah: ${salah}</p>`+
    `<h3>Penjelasan Jawaban:</h3>`+
    soal.map((s,i)=>`<p><b>${i+1}. ${s.t}</b><br>${s.p}</p>`).join('');
  gambarGrafik();
}

function gambarGrafik(){
  const ctx=document.getElementById('grafik').getContext('2d');
  new Chart(ctx,{
    type:'bar',
    data:{
      labels:['Benar','Salah'],
      datasets:[{
        data:[benar,salah]
      }]
    },
    options:{responsive:true}
  });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
