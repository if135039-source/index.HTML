<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kuis IPA Sekolah</title>
<style>
    body {
        font-family: "Poppins", sans-serif;
        text-align: center;
        background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1350&q=80');
        background-size: cover;
        color: white;
        padding: 40px;
    }

    h1 {
        font-size: 38px;
        text-shadow: 2px 2px 10px #000;
    }

    #quiz-box {
        background: rgba(0, 0, 0, 0.45);
        padding: 25px;
        border-radius: 18px;
        width: 450px;
        margin: auto;
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: #ffffffd8;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #ffe9bf;
        transform: scale(1.04);
    }

    .surprise {
        position: fixed;
        font-size: 50px;
        animation: pop 0.8s ease-out forwards;
        pointer-events: none;
    }

    @keyframes pop {
        0% { transform: scale(0.2) translateY(0); opacity: 0; }
        50% { transform: scale(1.2) translateY(-40px); opacity: 1; }
        100% { transform: scale(1) translateY(-90px); opacity: 0; }
    }
</style>
</head>
<body>

<h1>🎓 Kuis IPA Sekolah</h1>

<div id="quiz-box">
    <h2 id="question">Memuat soal...</h2>
    <div id="options"></div>
</div>

<!-- Suara klik lucu -->
<audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/387" preload="auto"></audio>

<script>
const questions = [
    {
        q: "Apa fungsi utama paru-paru?",
        options: ["Mengalirkan darah", "Pertukaran oksigen", "Mencerna makanan", "Mengatur suhu tubuh"],
        answer: 1
    },
    {
        q: "Planet yang dikenal sebagai 'Planet Merah' adalah?",
        options: ["Venus", "Mars", "Jupiter", "Merkurius"],
        answer: 1
    },
    {
        q: "Bagian tumbuhan yang bertugas menyerap air?",
        options: ["Daun", "Batang", "Akar", "Bunga"],
        answer: 2
    }
];

// Surprise emojis lucu
const surpriseList = ["✨","🎉","💥","🌈","💫","🦋","🍭","🎀","⭐"];

let current = 0;

function loadQuestion() {
    document.getElementById("question").innerText = questions[current].q;
    const opsDiv = document.getElementById("options");
    opsDiv.innerHTML = "";

    questions[current].options.forEach((opt, index) => {
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        opsDiv.appendChild(btn);
    });
}

function playClickSound() {
    document.getElementById("clickSound").play();
}

function showSurprise() {
    const emoji = surpriseList[Math.floor(Math.random() * surpriseList.length)];

    const s = document.createElement("div");
    s.className = "surprise";
    s.innerText = emoji;

    // Lokasi acak di layar
    s.style.left = Math.random() * window.innerWidth - 50 + "px";
    s.style.top = Math.random() * window.innerHeight - 50 + "px";

    document.body.appendChild(s);

    setTimeout(() => {
        s.remove();
    }, 900);
}

function checkAnswer(index) {
    playClickSound();
    showSurprise();

    if (index === questions[current].answer) {
        alert("Jawaban Benar! 🎉");
    } else {
        alert("Salah! Coba lagi 😅");
    }

    current++;
    if (current < questions.length) {
        loadQuestion();
    } else {
        alert("Kuis selesai! Kamu hebat! 🌟");
    }
}

loadQuestion();
</script>

</body>
</html>
