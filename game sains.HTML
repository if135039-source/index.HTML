<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Sains + Gambar Stabil</title>

<style>
    body {
        background: #e8f6ff;
        font-family: Arial;
        text-align: center;
        padding: 20px;
    }
    .box {
        background: white;
        padding: 20px;
        margin: auto;
        width: 600px;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    img {
        width: 260px;
        border-radius: 15px;
        margin-bottom: 10px;
    }
    .option {
        cursor: pointer;
        margin: 10px auto;
        padding: 10px;
        width: 80%;
        background: #d9ecff;
        border-radius: 10px;
        font-size: 18px;
    }
    .option:hover {
        background: #bfe0ff;
    }
</style>
</head>
<body>

<h1>🔬 Game Sains + Gambar (Versi Gambar Stabil)</h1>

<div class="box">
    <img id="img" src="" alt="">
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="result"></p>
    <button onclick="nextQuestion()">Soal Berikutnya</button>
</div>

<script>
const questions = [
    {
        q: "Planet apa ini?",
        img: "https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg",
        options: ["Mars", "Jupiter", "Earth", "Venus"],
        answer: 2
    },
    {
        q: "Bagian tumbuhan apakah ini?",
        img: "https://upload.wikimedia.org/wikipedia/commons/2/20/Leaf_Chromolithograph_detail.jpg",
        options: ["Batang", "Akar", "Daun", "Bunga"],
        answer: 2
    },
    {
        q: "Hewan apa ini?",
        img: "https://upload.wikimedia.org/wikipedia/commons/1/1c/Fish_in_Tonle_Sap.jpg",
        options: ["Kucing", "Anjing", "Ikan", "Semut"],
        answer: 2
    },
    {
        q: "Alat apakah ini?",
        img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Thermometer_%28PSF%29.png/640px-Thermometer_%28PSF%29.png",
        options: ["Termometer", "Barometer", "Kompas", "Lup"],
        answer: 0
    }
];

let current = 0;

function nextQuestion() {
    current = Math.floor(Math.random() * questions.length);
    let q = questions[current];

    document.getElementById("img").src = q.img;
    document.getElementById("question").innerHTML = q.q;

    let optHTML = "";
    q.options.forEach((opt, i) => {
        optHTML += `<div class="option" onclick="checkAnswer(${i})">${opt}</div>`;
    });
    document.getElementById("options").innerHTML = optHTML;

    document.getElementById("result").innerHTML = "";
}

function checkAnswer(i) {
    if (i === questions[current].answer) {
        document.getElementById("result").innerHTML = "✔️ Benar!";
        document.getElementById("result").style.color = "green";
    } else {
        document.getElementById("result").innerHTML =
            "❌ Salah! Jawaban: " + questions[current].options[questions[current].answer];
        document.getElementById("result").style.color = "red";
    }
}

nextQuestion();
</script>

</body>
</html>
