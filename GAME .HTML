<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>EcoFarm · waste & farming game</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b2a1e 0%, #1a4a33 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* main game-card */
    .game-dashboard {
      max-width: 480px;
      width: 100%;
      background: rgba(34, 68, 51, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 56px 56px 40px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 2px #7cb083 inset;
      padding: 24px 20px 30px;
      transition: all 0.2s ease;
      border: 1px solid #a7d6a7;
    }

    /* ===== profile row ===== */
    .profile-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,0.25);
      border-radius: 100px;
      padding: 8px 16px 8px 10px;
      backdrop-filter: blur(4px);
      border: 1px solid #7cb083;
      margin-bottom: 20px;
    }

    .avatar {
      position: relative;
      width: 64px;
      height: 64px;
      background: radial-gradient(circle at 30% 30%, #f7e8b0, #d9b382);
      border-radius: 50%;
      border: 3px solid #f5d742;
      box-shadow: 0 0 0 3px #1a3a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #3d2b1a;
    }

    .level-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: #f5b042;
      color: #1f2f1f;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 40px;
      border: 2px solid #1e3d28;
      box-shadow: 0 2px 0 #0f1f12;
      letter-spacing: 0.5px;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-weight: 700;
      font-size: 20px;
      color: #f7f7d8;
      text-shadow: 0 2px 3px #0f2a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-name i {
      color: #ffd966;
      font-size: 16px;
    }

    .user-title {
      font-size: 15px;
      font-weight: 500;
      color: #b5e0b5;
      background: #1e3f2c;
      display: inline-block;
      padding: 2px 16px 2px 12px;
      border-radius: 40px;
      border: 1px solid #7cb083;
      backdrop-filter: blur(2px);
      margin-top: 2px;
    }

    .user-title i {
      margin-right: 6px;
      color: #f5d742;
    }

    /* ===== coin wallet ===== */
    .wallet-section {
      background: linear-gradient(135deg, #2d543c, #1d3a28);
      border-radius: 60px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #b5d6a3;
      box-shadow: 0 8px 0 #0a1e12, inset 0 2px 10px #b3e0a0;
    }

    .coin-display {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-icon {
      font-size: 38px;
      color: #f7d44a;
      filter: drop-shadow(0 4px 4px #1f3a1a);
    }

    .coin-amount {
      font-size: 32px;
      font-weight: 800;
      color: #feffd2;
      letter-spacing: 1px;
      text-shadow: 0 3px 0 #2b4f2b;
    }

    .btn-deposit {
      background: #facc15;
      border: none;
      border-radius: 60px;
      padding: 12px 22px;
      font-weight: 800;
      font-size: 18px;
      color: #1f3d28;
      box-shadow: 0 6px 0 #b58b1a, 0 8px 12px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.08s linear;
      border: 2px solid #fce285;
    }

    .btn-deposit:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b58b1a;
    }

    .btn-deposit i {
      font-size: 20px;
    }

    /* ===== level progress + streak ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #1e3d2b;
      border-radius: 32px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid #68a06b;
      box-shadow: inset 0 0 10px #2c5a3a;
      backdrop-filter: blur(2px);
    }

    .stat-card i {
      font-size: 24px;
      color: #f5c542;
      margin-right: 6px;
    }

    .stat-card .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: #f2f7d7;
      display: block;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 14px;
      font-weight: 500;
      color: #b1d9b1;
      letter-spacing: 0.3px;
    }

    /* ===== AI CHAT CARD ===== */
    .ai-chat-card {
      background: #132b1d;
      border-radius: 44px;
      padding: 18px 20px 22px;
      border: 2px solid #7fb07f;
      box-shadow: 0 8px 0 #0d1f13, inset 0 0 20px #2d6b3a;
      margin: 22px 0 12px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #e3f0d3;
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 16px;
      background: #234d30;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      width: fit-content;
      border: 1px solid #7cb083;
    }

    .chat-header i {
      color: #87e0b0;
      font-size: 22px;
      background: #0f2e1b;
      padding: 6px;
      border-radius: 50%;
    }

    .chat-preview {
      background: #1d3a27;
      border-radius: 30px;
      padding: 12px 16px;
      color: #cdedc5;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #54965a;
      flex-wrap: wrap;
    }

    .chat-preview .message {
      flex: 1;
      font-size: 15px;
      font-weight: 400;
      background: #0b2317;
      padding: 8px 14px;
      border-radius: 40px;
      border-left: 4px solid #b8d97a;
    }

    .chat-actions {
      display: flex;
      gap: 8px;
    }

    .chat-btn {
      background: #3d6d48;
      border: none;
      border-radius: 40px;
      padding: 8px 14px;
      font-weight: 600;
      color: #f5ffea;
      box-shadow: 0 4px 0 #1c3a20;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      border: 1px solid #89b884;
      cursor: pointer;
      transition: 0.04s linear;
    }

    .chat-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1c3a20;
    }

    .chat-btn i {
      font-size: 18px;
    }

    .camera-btn {
      background: #4d3f1f;
      border-color: #dbb052;
    }

    /* ===== farm / waste stats ===== */
    .farm-stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0 6px;
      background: #1d3a2a;
      border-radius: 40px;
      padding: 12px 4px;
      border: 1px solid #75a573;
    }

    .farm-stat-item {
      text-align: center;
      color: #daf0d0;
    }

    .farm-stat-item i {
      color: #f7d44a;
      font-size: 20px;
    }

    .farm-stat-item span {
      display: block;
      font-weight: 700;
      font-size: 18px;
      color: #f9fad6;
    }

    /* ===== responsive ===== */
    @media (max-width: 440px) {
      .game-dashboard { padding: 16px; }
      .btn-deposit { padding: 10px 14px; font-size: 16px; }
      .coin-amount { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="game-dashboard" id="app">

    <!-- PROFILE ROW -->
    <div class="profile-row">
      <div class="avatar">
        🌾
        <span class="level-badge">Lv.8</span>
      </div>
      <div class="user-info">
        <div class="user-name">
          Petani Hijau
          <i class="fas fa-leaf" style="color:#7ed47e;"></i>
        </div>
        <div class="user-title">
          <i class="fas fa-star"></i> Master Gardener
        </div>
      </div>
      <div style="margin-left: auto; display: flex; gap: 6px;">
        <i class="fas fa-trophy" style="color: #f5b042; font-size: 28px; filter: drop-shadow(0 0 6px #f5b042);"></i>
      </div>
    </div>

    <!-- WALLET + DEPOSIT -->
    <div class="wallet-section">
      <div class="coin-display">
        <i class="fas fa-coins coin-icon"></i>
        <span class="coin-amount" id="coinCounter">2,480</span>
      </div>
      <button class="btn-deposit" id="depositBtn">
        <i class="fas fa-recycle"></i> Setor
      </button>
    </div>

    <!-- STATS grid : level + XP -->
    <div class="stats-grid">
      <div class="stat-card">
        <i class="fas fa-seedling"></i>
        <span class="stat-value">8</span>
        <span class="stat-label">Level Petani</span>
      </div>
      <div class="stat-card">
        <i class="fas fa-fire"></i>
        <span class="stat-value">1.2k</span>
        <span class="stat-label">XP / next</span>
      </div>
    </div>

    <!-- AI CHAT (dengan foto & tanya) -->
    <div class="ai-chat-card">
      <div class="chat-header">
        <i class="fas fa-robot"></i> AI Tani · Bijak
        <span style="margin-left: auto; font-size: 14px; background: #15331f; padding: 2px 14px; border-radius: 60px; border:1px solid #7bb07b;"><i class="fas fa-circle" style="color: #7cf07c; font-size: 10px;"></i> aktif</span>
      </div>
      <div class="chat-preview">
        <div class="message">
          <i class="fas fa-quote-left" style="opacity: 0.5; margin-right: 6px;"></i>
          Halo! foto atau tanya soal limbah & tanaman...
        </div>
        <div class="chat-actions">
          <button class="chat-btn camera-btn" id="cameraBtn"><i class="fas fa-camera"></i> Foto</button>
          <button class="chat-btn" id="askBtn"><i class="fas fa-pen"></i> Tanya</button>
        </div>
      </div>
      <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <span style="background: #0d2d1a; border-radius: 60px; padding: 4px 16px; border:1px solid #5e8f5e; color: #b7e0b7; font-size: 13px;"><i class="fas fa-leaf"></i> deteksi hama</span>
        <span style="background: #0d2d1a; border-radius: 60px; padding: 4px 16px; border:1px solid #5e8f5e; color: #b7e0b7; font-size: 13px;"><i class="fas fa-trash"></i> limbah organik</span>
        <span style="background: #0d2d1a; border-radius: 60px; padding: 4px 16px; border:1px solid #5e8f5e; color: #b7e0b7; font-size: 13px;"><i class="fas fa-seedling"></i> kompos</span>
      </div>
    </div>

    <!-- tambahan farm stat (game feel) -->
    <div class="farm-stats">
      <div class="farm-stat-item">
        <i class="fas fa-tractor"></i>
        <span>12</span> <small>lahan</small>
      </div>
      <div class="farm-stat-item">
        <i class="fas fa-recycle"></i>
        <span>4.2t</span> <small>olah limbah</small>
      </div>
      <div class="farm-stat-item">
        <i class="fas fa-clock"></i>
        <span>6h</span> <small>panen</small>
      </div>
    </div>

    <!-- footer game-like -->
    <div style="display: flex; justify-content: center; margin-top: 18px; gap: 14px; color: #97b897; font-size: 13px; background: #0c281a; padding: 6px 12px; border-radius: 60px; border:1px solid #46834b; width: fit-content; margin-left: auto; margin-right: auto;">
      <i class="fas fa-gamepad"></i> quest: setor 3x limbah
      <i class="fas fa-chevron-right" style="color: #e5b13b;"></i> +50 XP
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const coinSpan = document.getElementById('coinCounter');
      const depositBtn = document.getElementById('depositBtn');
      const cameraBtn = document.getElementById('cameraBtn');
      const askBtn = document.getElementById('askBtn');

      // Local state (game-like)
      let coinAmount = 2480;   // starting value

      // helper: format number with comma
      function formatCoin(val) {
        return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      // update UI coin
      function updateCoinDisplay() {
        coinSpan.textContent = formatCoin(coinAmount);
      }

      // DEPOSIT WASTE (game action)
      function handleDeposit() {
        // random gain between 25 - 80 coins
        const gain = Math.floor(Math.random() * 55) + 25;
        coinAmount += gain;
        updateCoinDisplay();

        // haptic-like feedback (visual)
        depositBtn.style.transform = 'scale(0.95)';
        setTimeout(() => { depositBtn.style.transform = ''; }, 100);

        // extra pop-up effect (optional)
        const popup = document.createElement('div');
        popup.textContent = `+${gain} 🪙`;
        popup.style.position = 'fixed';
        popup.style.left = '50%';
        popup.style.top = '40%';
        popup.style.transform = 'translate(-50%, -50%)';
        popup.style.background = '#1d3a1d';
        popup.style.color = '#f5e56b';
        popup.style.padding = '18px 32px';
        popup.style.borderRadius = '80px';
        popup.style.fontWeight = '800';
        popup.style.fontSize = '28px';
        popup.style.border = '3px solid #f5c542';
        popup.style.boxShadow = '0 12px 0 #0a1e0a';
        popup.style.zIndex = '999';
        popup.style.transition = 'opacity 0.2s';
        popup.style.pointerEvents = 'none';
        document.body.appendChild(popup);
        setTimeout(() => {
          popup.style.opacity = '0';
          setTimeout(() => popup.remove(), 300);
        }, 700);

        // juga naikkan level (simulasi)
        const levelBadge = document.querySelector('.level-badge');
        if (levelBadge) {
          let lv = parseInt(levelBadge.textContent.replace('Lv.','')) || 8;
          if (coinAmount > 2800 && lv < 9) {
            levelBadge.textContent = 'Lv.9';
            // update title to master ++
            const title = document.querySelector('.user-title');
            if (title) title.innerHTML = '<i class="fas fa-star"></i> Master Gardener ★';
          } else if (coinAmount > 3200 && lv < 10) {
            levelBadge.textContent = 'Lv.10';
            const title = document.querySelector('.user-title');
            if (title) title.innerHTML = '<i class="fas fa-crown"></i> Legendary Farmer';
          }
        }
      }

      // AI CHAT : simulasi foto & tanya
      function simulateAI(trigger) {
        const msgDiv = document.querySelector('.chat-preview .message');
        if (!msgDiv) return;
        const originalMsg = msgDiv.innerHTML;

        if (trigger === 'camera') {
          msgDiv.innerHTML = `<i class="fas fa-camera" style="margin-right: 8px;"></i> 📷 Menganalisis foto... (simulasi) “Tanaman terlihat sehat, tapi ada hama kecil di daun. Semprot organik!”`;
        } else if (trigger === 'ask') {
          msgDiv.innerHTML = `<i class="fas fa-comment" style="margin-right: 8px;"></i> 🤖 “Untuk limbah pertanian, buat kompos dari sisa panen. Tambahkan EM4.”`;
        }

        // reset after 4 detik ke pesan awal
        setTimeout(() => {
          msgDiv.innerHTML = `<i class="fas fa-quote-left" style="opacity: 0.5; margin-right: 6px;"></i> Halo! foto atau tanya soal limbah & tanaman...`;
        }, 5000);
      }

      // --- event listeners ---
      depositBtn.addEventListener('click', handleDeposit);

      cameraBtn.addEventListener('click', function(e) {
        e.preventDefault();
        simulateAI('camera');
        // little haptic
        cameraBtn.style.transform = 'scale(0.9)';
        setTimeout(() => cameraBtn.style.transform = '', 120);
      });

      askBtn.addEventListener('click', function(e) {
        e.preventDefault();
        simulateAI('ask');
        askBtn.style.transform = 'scale(0.9)';
        setTimeout(() => askBtn.style.transform = '', 120);
      });

      // tambahan: tombol deposit juga dapat diakses dari keyboard (enter)
      // inisialisasi
      updateCoinDisplay();

      // extra: saat pertama kali load, tampilkan pesan selamat datang di chat
      setTimeout(() => {
        const msgDiv = document.querySelector('.chat-preview .message');
        if (msgDiv) {
          msgDiv.innerHTML = `<i class="fas fa-seedling" style="margin-right: 6px; color: #9bd69b;"></i> Selamat datang, Master! foto tanaman atau tanya soal limbah.`;
          setTimeout(() => {
            msgDiv.innerHTML = `<i class="fas fa-quote-left" style="opacity: 0.5; margin-right: 6px;"></i> Halo! foto atau tanya soal limbah & tanaman...`;
          }, 3000);
        }
      }, 400);

      // level badge tambahan jika user klik "setor" berulang
      console.log('🌱 EcoFarm game dashboard siap!');
    })();
  </script>
</body>
</html>
