<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kalkulator Kesehatan</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #ffcce6;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 24 24' fill='%23ff4da6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 21s-6.716-4.567-10-9.8C-1.279 7.6 1.543 2 6.25 2 9.021 2 12 4.5 12 4.5S14.979 2 17.75 2C22.457 2 25.279 7.6 22 11.2 18.716 16.433 12 21 12 21z'/%3E%3C/svg%3E");
        background-size: 80px;
        background-repeat: repeat;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        margin: auto;
        padding: 20px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #ff4da6;
        border: none;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
    }

    button:hover {
        background: #ff1a8c;
    }

    .result {
        margin-top: 15px;
        padding: 15px;
        border-radius: 10px;
        background: #fbe6f3;
    }

    h2 {
        text-align: center;
        color: #ff1a8c;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Kalkulator Kesehatan</h2>

    <label>Berat Badan (kg)</label>
    <input type="number" id="bb">

    <label>Tinggi Badan (cm)</label>
    <input type="number" id="tb">

    <label>Umur (tahun)</label>
    <input type="number" id="umur">

    <button onclick="hitung()">Hitung</button>

    <div class="result" id="hasil"></div>

    <canvas id="chartHasil" style="margin-top:20px;"></canvas>
</div>

<script>
function hitung() {
    let bb = parseFloat(document.getElementById("bb").value);
    let tb = parseFloat(document.getElementById("tb").value) / 100; 
    let umur = parseFloat(document.getElementById("umur").value);

    if (!bb || !tb || !umur) {
        document.getElementById("hasil").innerHTML = 
            "<b>Mohon isi semua data.</b>";
        return;
    }

    let bmi = bb / (tb * tb);
    let kategori = "";
    let saran = "";

    if (bmi < 18.5) {
        kategori = "Kurus";
        saran = "Perbanyak makan protein, karbo sehat, dan susu.";
    } else if (bmi < 25) {
        kategori = "Normal";
        saran = "Pertahankan pola makan seimbang dan minum air cukup.";
    } else if (bmi < 30) {
        kategori = "Berlebih";
        saran = "Kurangi gula/tepung, perbanyak buah dan sayur.";
    } else {
        kategori = "Obesitas";
        saran = "Konsultasikan pola makan, hindari gorengan dan junk food.";
    }

    let rataRata = (bb + tb*100 + umur) / 3;

    document.getElementById("hasil").innerHTML = `
        <b>Hasil Perhitungan:</b><br>
        BMI: ${bmi.toFixed(2)} <br>
        Kategori: <b>${kategori}</b> <br><br>
        <b>Saran Makanan:</b> ${saran}<br><br>
        <b>Nilai Rata-rata Data:</b> ${rataRata.toFixed(2)}
    `;

    // Grafik
    if (window.grafikHasil) {
        window.grafikHasil.destroy();
    }

    let ctx = document.getElementById("chartHasil").getContext("2d");
    window.grafikHasil = new Chart(ctx, {
        type: "bar",
        data: {
            labels: ["Berat", "Tinggi(cm)", "Umur"],
            datasets: [{
                label: "Nilai Input",
                data: [bb, tb*100, umur]
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
        }
    });
}
</script>

</body>
</html>
