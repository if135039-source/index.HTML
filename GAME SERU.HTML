<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Petualangan Edukasi — Game Kuis</title>
  <style>
    :root{--bg:#f5fbff;--card:#ffffff;--accent:#3b82f6;--good:#16a34a;--bad:#ef4444}
    *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{margin:0;background:linear-gradient(180deg,#e6f7ff 0%,#fff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .wrap{width:980px;max-width:100%;display:grid;grid-template-columns:1fr 360px;gap:18px}
    .card{background:var(--card);border-radius:14px;box-shadow:0 8px 30px rgba(2,6,23,0.08);padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    h1{font-size:20px;margin:0}
    .meta{font-size:13px;color:#475569}
    #scene{height:220px;border-radius:10px;background:linear-gradient(135deg,#fef3c7,#fee2e2);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
    #scene .hero{width:96px;height:96px;border-radius:12px;background:linear-gradient(45deg,#fff,#ffd6e0);display:flex;align-items:center;justify-content:center;font-weight:700}
    #question{margin-top:12px;font-size:18px}
    .choices{display:grid;gap:10px;margin-top:12px}
    .choice{padding:10px;border-radius:10px;border:1px solid #e6eef8;background:#fbfdff;cursor:pointer;transition:all .18s;user-select:none}
    .choice:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(59,130,246,0.08)}
    .choice.correct{border-color:var(--good);background:rgba(22,163,74,0.07)}
    .choice.wrong{border-color:var(--bad);background:rgba(239,68,68,0.06)}
    .controls{display:flex;gap:8px;margin-top:12px}
    button{padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:white;cursor:pointer}
    button.secondary{background:#94a3b8}
    /* confetti */
    .confetti{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
    .confetti .p{position:absolute;width:10px;height:14px;opacity:0;transform:translateY(-10px) rotate(0deg);animation:fall 1400ms linear forwards}
    @keyframes fall{to{transform:translateY(260px) rotate(360deg);opacity:1}}
    /* shake */
    .shake{animation:shake .5s}
    @keyframes shake{10%{transform:translateX(-6px)}30%{transform:translateX(6px)}50%{transform:translateX(-4px)}70%{transform:translateX(4px)}100%{transform:translateX(0)}}
    /* Right/wrong flash */
    .flash-good{box-shadow:0 0 0 6px rgba(16,185,129,0.08) inset}
    .flash-bad{box-shadow:0 0 0 6px rgba(239,68,68,0.06) inset}
    /* right/wrong counter badge */
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#f1f5f9}
    /* right panel */
    .stats{display:flex;flex-direction:column;gap:12px}
    .chart-wrap{height:220px}
    .history{max-height:160px;overflow:auto;padding:6px;border-radius:8px;background:#fbfdff;border:1px solid #eef2ff}
    .log{font-size:13px;padding:6px;border-bottom:1px dashed #e6eef8}
    footer{margin-top:12px;text-align:center;color:#64748b;font-size:13px}
    @media(max-width:920px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div>
          <h1>Petualangan Edukasi — Level 1</h1>
          <div class="meta">Jawab soal untuk membuka area baru. Minimal 10 soal.</div>
        </div>
        <div>
          <span class="badge">Benar: <strong id="correctCount">0</strong></span>
          <span class="badge">Salah: <strong id="wrongCount">0</strong></span>
        </div>
      </header>

      <div id="scene">
        <div class="confetti" id="confetti"></div>
        <div class="hero" id="hero">🔎</div>
        <div id="questionArea" style="position:relative;z-index:2">
          <div id="question">Tekan mulai untuk memulai petualangan!</div>
          <div class="choices" id="choices"></div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn">Mulai Petualangan</button>
        <button id="nextBtn" class="secondary" disabled>Soal Berikutnya</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </div>

    <aside class="card">
      <div class="stats">
        <div>
          <strong>Grafik Jawaban</strong>
          <div class="chart-wrap"><canvas id="resultChart"></canvas></div>
        </div>
        <div>
          <strong>Riwayat</strong>
          <div class="history" id="history"></div>
        </div>
        <div>
          <strong>Rata-rata Benar</strong>
          <div style="font-size:24px;padding-top:8px" id="avgDisplay">0%</div>
        </div>
      </div>
      <footer>Game sederhana: cocok untuk SD–SMP. Kamu bisa menambah soal di file kode.</footer>
    </aside>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // --- Soal minimal 10 soal ---
    const QUESTIONS = [
      {q: 'Berapakah hasil 7 + 5?', a: ['10','11','12','13'], correct: 2},
      {q: 'Ibu kota Indonesia adalah?', a:['Bandung','Medan','Jakarta','Surabaya'], correct:2},
      {q: 'Mana yang merupakan hewan mamalia?', a:['Ayam','Ikan','Kucing','Ular'], correct:2},
      {q: 'Benda yang mengapung di air adalah?', a:['Batu','Kayu','Logam berat','Paku'], correct:1},
      {q: 'Planet yang paling dekat dengan Matahari?', a:['Bumi','Venus','Merkurius','Mars'], correct:2},
      {q: 'Hasil dari 9 x 3 adalah?', a:['27','24','21','30'], correct:0},
      {q: 'Air berubah menjadi uap melalui proses?', a:['Mencair','Menguap','Membeku','Mendidih'], correct:1},
      {q: 'Bahasa resmi Brazil adalah?', a:['Spanyol','Portugis','Inggris','Prancis'], correct:1},
      {q: 'Sifat benda padat adalah?', a:['Bentuk tetap','Mudah mengalir','Bentuk berubah terus','Tidak memiliki massa'], correct:0},
      {q: 'Kelistrikan mengalir melalui?', a:['Karet','Kayu','Tembaga','Kertas'], correct:2},
      {q: 'Huruf vokal dalam "A E I O U" berjumlah?', a:['4','5','6','3'], correct:1},
      {q: 'Sumber energi dari matahari disebut?', a:['Geothermal','Nuklir','Surya','Fosil'], correct:2}
    ];

    // state
    let pool = []; // shuffled order
    let idx = -1;
    let correctCount = 0, wrongCount = 0;

    const qEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const historyEl = document.getElementById('history');
    const avgEl = document.getElementById('avgDisplay');
    const hero = document.getElementById('hero');
    const confettiWrap = document.getElementById('confetti');

    // Chart
    const ctx = document.getElementById('resultChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'doughnut',
      data: {labels:['Benar','Salah'],datasets:[{data:[0,0],backgroundColor:['#10b981','#ef4444']} ]},
      options:{responsive:true,plugins:{legend:{position:'bottom'}}}
    });

    function updateChart(){
      chart.data.datasets[0].data = [correctCount, wrongCount];
      chart.update();
    }

    function updateStats(){
      correctCountEl.textContent = correctCount;
      wrongCountEl.textContent = wrongCount;
      updateChart();
      const total = correctCount + wrongCount;
      const avg = total ? Math.round((correctCount/total)*100) : 0;
      avgEl.textContent = avg + '%';
    }

    function shuffle(a){
      return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
    }

    function start(){
      pool = shuffle(QUESTIONS.slice());
      idx = -1;
      correctCount = 0; wrongCount = 0;
      historyEl.innerHTML = '';
      updateStats();
      nextBtn.disabled = false;
      startBtn.disabled = true;
      nextQuestion();
    }

    function nextQuestion(){
      idx++;
      if(idx >= pool.length){
        qEl.textContent = 'Kamu sudah menjawab semua soal! Tekan Mulai lagi untuk mengulang.';
        choicesEl.innerHTML = '';
        nextBtn.disabled = true;
        startBtn.disabled = false;
        return;
      }
      const cur = pool[idx];
      qEl.textContent = cur.q;
      choicesEl.innerHTML = '';
      cur.a.forEach((ans,i)=>{
        const d = document.createElement('div');
        d.className = 'choice';
        d.textContent = ans;
        d.onclick = ()=>selectAnswer(i);
        choicesEl.appendChild(d);
      })
    }

    function selectAnswer(choiceIndex){
      const cur = pool[idx];
      const items = Array.from(document.querySelectorAll('.choice'));
      items.forEach((el, i)=>el.onclick=null); // disable further clicks

      const correctIndex = cur.correct;
      if(choiceIndex === correctIndex){
        // correct
        items[choiceIndex].classList.add('correct');
        correctCount++;
        addHistory(true, cur.q);
        surpriseCorrect();
      } else {
        // wrong
        items[choiceIndex].classList.add('wrong');
        items[correctIndex].classList.add('correct');
        wrongCount++;
        addHistory(false, cur.q);
        surpriseWrong();
      }
      updateStats();
    }

    function addHistory(isRight, text){
      const div = document.createElement('div');
      div.className = 'log';
      div.innerHTML = (isRight? '✅ <strong>Benar</strong>' : '❌ <strong>Salah</strong>') + ' — ' + text;
      historyEl.prepend(div);
    }

    // --- Surprise effects ---
    function surpriseCorrect(){
      // hero celebration
      hero.textContent = '🎉';
      hero.classList.add('flash-good');
      playTone(880,0.08);
      confettiBurst();
      setTimeout(()=>{hero.textContent='🔎'; hero.classList.remove('flash-good')},1200);
    }

    function surpriseWrong(){
      hero.textContent = '😵';
      hero.classList.add('shake','flash-bad');
      playTone(220,0.12);
      setTimeout(()=>{hero.textContent='🔎'; hero.classList.remove('shake','flash-bad')},900);
    }

    // small confetti using DOM elements
    function confettiBurst(){
      const count = 28;
      for(let i=0;i<count;i++){
        const p = document.createElement('div');
        p.className = 'p';
        p.style.left = (50 + (Math.random()*60 - 30)) + '%';
        p.style.top = '-10px';
        p.style.background = randomColor();
        p.style.transform = `translateY(-10px) rotate(${Math.random()*360}deg)`;
        p.style.animationDuration = (900 + Math.random()*700) + 'ms';
        p.style.opacity = 1;
        confettiWrap.appendChild(p);
        setTimeout(()=>p.remove(),1600);
      }
    }

    function randomColor(){
      const palette = ['#ff385c','#fb923c','#f97316','#f59e0b','#facc15','#34d399','#60a5fa','#7c3aed'];
      return palette[Math.floor(Math.random()*palette.length)];
    }

    // tiny beep using WebAudio
    function playTone(freq,dur){
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine'; o.frequency.value = freq;
        g.gain.value = 0.06;
        o.connect(g); g.connect(ctx.destination);
        o.start();
        setTimeout(()=>{g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.03);o.stop();ctx.close();}, dur*1000);
      }catch(e){console.warn('Audio not available',e)}
    }

    // controls
    startBtn.onclick = start;
    nextBtn.onclick = ()=>{
      nextQuestion();
    };
    resetBtn.onclick = ()=>{
      pool = [];
      idx = -1;
      correctCount = 0; wrongCount = 0;
      startBtn.disabled = false;
      nextBtn.disabled = true;
      qEl.textContent = 'Tekan mulai untuk memulai petualangan!';
      choicesEl.innerHTML = '';
      historyEl.innerHTML = '';
      updateStats();
    }

    // init
    updateStats();
  </script>
</body>
</html>
